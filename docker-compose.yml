services:
  audit-scanner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datacheck_audit_scanner
    ports:
      - "8000:8000"
    shm_size: '1gb'
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres_pass@db:5432/privacy_audit
      - SCAN_TIMEOUT_SECONDS=25.0
      - SCAN_PAGE_TIMEOUT_MS=15000
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-alertas@datacheck.cl}
      - SMTP_TLS=${SMTP_TLS:-false}
      - SCHEDULER_CHECK_INTERVAL_SECONDS=30
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped


  db:
    image: postgres:16-alpine
    container_name: datacheck_audit_db
    environment:
      - POSTGRES_DB=privacy_audit
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d privacy_audit"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: datacheck_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  postgres_data:

